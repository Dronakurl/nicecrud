[project]
name = "niceguicrud"
version = "0.1.13"
description = "Edit your pydantic models with a nice GUI - CRUD Create Update Replace Delete"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "nicegui>=3.0.0",
  "httpx",
  "pydantic>=2.8.0",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]

[[project.authors]]
name = "Dronakurl"
email = "tbo73oij5@mozmail.com"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pre-commit", "playwright", "pytest-playwright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--ignore=.archiv",
  "--ignore=scripts",
  "--no-header",
]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.playwright]
browsers = ["chromium"]

[tool.ruff]
line-length = 100
exclude = ["**/__init__.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PERF", "TRY004"]
ignore = [
  "E501",    # line length is left to the formatter
  "C408",    # dict(...) calls are used deliberately for kwargs-style config
  "UP046",   # keep Generic[T] for compatibility with the existing class API
  "B008",    # NiceCRUDConfig() defaults are intentional
  "SIM102",
  "SIM117",
  "RUF012",
  "RUF001", "RUF002", "RUF003",
]

[tool.black]
line-length = 100
